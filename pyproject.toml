[project]
name = "amazon-review-dashboard"
version = "0.1.0"
description = "Amazon review keyword dashboard demo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20,<1",
    "jieba==0.42.1",
    "pandas>=3.0.5",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
